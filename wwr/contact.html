<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapids Adventures</title>
    <meta name="description" content="Contact White Water Rafting Company in Kolob, California. Ask about trips, reservations, or send us your suggestions.">
    <meta name="author" content="Magala Emmanuel">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-rapids-trees.jpg" alt="Rapids rafting company logo" width="100">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>Rapids Adventure</h1>
            <address>
                123 Main River Street<br>
                Nwoya, Buliisa<br>
                <a href="tel:+256743703052">+256 743 703 052</a><br>
                <a href="mailto:info@rapidsadventure.com">info@rapidsadventure.com</a>
            </address>
        </section>
        <div class="contact-layout">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1109.8363734898337!2d31.412470270809404!3d2.1074003150204637!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x176543000f85101f%3A0x3b1cc4875233eb4f!2sMurchison%20xp%20hotel!5e0!3m2!1sen!2sug!4v1795500818959!5m2!1sen!2sug" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="map showing Rapids"></iframe>
        <form action="#" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <fieldset>
                <legend>Message Purpose</legend>

                <input type="radio" id="general" name="purpose" value="general" checked>
                <label for="general">General Inquiry</label>

                <input type="radio" id="reservation" name="purpose" value="reservation">
                <label for="reservation">Reservation Question</label>

                <input type="radio" id="suggestion" name="purpose" value="suggestion">
                <label for="suggestion">Website Suggestion</label>
            </fieldset>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>
            <input type="checkbox" id="newsletter" name="newsletter" value="yes">
            <label for="newsletter">Please subscribe me to the monthly newsletter</label>
            <button type="submit">Get in Touch!</button>
        </form>
        </div>
        <section class="staff">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/esteem.webp" alt="Portrait of Name One" width="150" height="150">
                <figcaption>Esteem Emmanuel<br>Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="images/ruth.webp" alt="Portrait of Name Two" width="150" height="150">
                <figcaption>Nabirye Ruth<br>Office Manager</figcaption>
            </figure>

            <figure>
                <img src="images/phionah.webp" alt="Portrait of Name Three" width="150" height="150">
                <figcaption>Kusasira Solomon<br>Safety Instructor</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Rapids Adventures | Magala Emmanuel</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook.png" alt="Facebook" width="32"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram.jpg" alt="Instagram" width="32"></a>
            <a href="https://www.youtube.com/"><img src="images/youtube.webp" alt="YouTube" width="32"></a>
        </nav>
    </footer>
</body>

</html>
